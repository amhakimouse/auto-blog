version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Content Automation Engine — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   postgres  — Primary datastore
#   redis     — Message broker for Celery
#   backend   — FastAPI ASGI server (Uvicorn)
#   worker    — Celery worker (shares same image as backend)
#   frontend  — React + TypeScript (Vite dev server)
# ─────────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app           # live-reload mount for development
    - ../google_cloud_api.json:/secrets/gcp-service-account.json:ro   # GCP auth
  networks:
    - internal

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    ports:
      - "5432:5432"   # expose for local DB tools (remove in prod)

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    ports:
      - "6379:6379"   # expose for local inspection (remove in prod)

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    <<: *backend-common
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    command: >
      bash -c "pip install -r requirements.txt &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --reload-include '*.py'
      --reload-include '*.env'"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    <<: *backend-common
    environment:
      - FLARESOLVERR_URL=http://flaresolverr:8191
    # Use watchmedo (from watchdog) to auto-restart Celery on code changes
    command: >
      bash -c "pip install -r requirements.txt &&
      watchmedo auto-restart
      --directory=/app/app
      --pattern='*.py'
      --recursive
      --
      celery -A app.worker.celery_app worker
      --loglevel=info
      --concurrency=1
      --queues=default,high_priority"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


  # ── FlareSolverr (Cloudflare Bypass) ────────────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    networks:
      - internal


  # ── Celery Beat (scheduler — optional, for future cron jobs) ────────────────
  beat:
    <<: *backend-common
    command: >
      celery -A app.worker.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    profiles:
      - scheduler   # only starts when: docker compose --profile scheduler up

  # ── Celery Flower (monitoring) ──────────────────────────────────────────────
  flower:
    <<: *backend-common
    command: >
      celery -A app.worker.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - internal

  # ── Watchtower (Auto-updates) ───────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=3600  # Check for updates every hour
      - WATCHTOWER_CLEANUP=true        # Remove old images after updating
    networks:
      - internal

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules          # anonymous volume so host doesn't shadow deps
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - CHOKIDAR_USEPOLLING=true
    networks:
      - internal
    depends_on:
      - backend
    command: >
      sh -c "npm install --no-audit --no-fund --silent &&
      npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
